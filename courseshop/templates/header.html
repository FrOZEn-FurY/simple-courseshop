{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="message {% if message.tags %} {{ message.tags }} {% endif %} ">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

<header class="header">
    <a href="{% url 'home' %}">خانه</a>
    <a href="{% url 'categories' %}">دسته بندی ها</a>
    {% if request.user.is_authenticated %}
        <a href="{% url 'profile' request.user.pk %}">پروفایل</a>
    {% else %}
        <a href="{% url 'login' %}">ورود</a>{{ " / " }}
        <a href="{% url 'signup' %}">ثبت نام</a>
    {% endif %}
</header>
