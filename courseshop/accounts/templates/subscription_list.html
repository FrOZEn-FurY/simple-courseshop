{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link href="{% static 'css/subscriptions.css' %}" rel="stylesheet" />
{% endblock head %}

{% block content %}
    <div class="subscriptions">
        {% for sub in object_list %}
            <div class="sub">
                <div>نام: {{ sub.title }}</div>
                <div>مدت: {{ sub.duration }} روز</div>
                <div>قیمت: {{ sub.price }} ریال</div>
                <a href="{% url 'buy-subscription' sub.pk %}">خرید اشتراک</a>
            </div>
        {% empty %}
            <div>No items to be shown.</div>
        {% endfor %}
    </div>
{% endblock content %}
