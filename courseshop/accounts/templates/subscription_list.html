{% block head %}
    <link href="{% static 'css/subscriptions.css' %}" rel="stylesheet" />
{% endblock head %}

{% block content %}
    <div class="subscriptions">
        {% for sub in subscriptions %}
            <div class="sub">
                <div>{{ sub.title }}</div>
                <div>{{ sub.duration }}</div>
                <div>{{ sub.price }}</div>
            </div>
        {% empty %}
            <div>No items to be shown.</div>
        {% endfor %}
    </div>
{% endblock content %}
