{% extends "base.html" %}

{% block title %}Login{% endblock title %}

{% block content %}
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit" />
    </form>
    <div style="display: flex; flex-direction: column; padding: 0.5rem; margin: 0.5rem; gap: 0.25rem;">
        <a href="{% url 'change-password' %}">عوض کردن پسوورد</a>
        <a href="{% url 'logout' %}">خروج</a>
    </div>
    {% if time_remaining %}
        <div>{{ time_remaining }} از اشتراک شما باقی مانده</div>
        <div>نوع اشتراک: {{ request.user.subscription.title }}</div>
    {% endif %}
{% endblock content %}
