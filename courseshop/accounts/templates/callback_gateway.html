
{% extends "base.html" %}

{% block title %}نتیجه عملیات{% endblock %}

{% block extra_css %}

{% endblock %}

{% block body_class %}callback-page{% endblock %}

{% block content %}

        <div class="status-icon" aria-hidden="true">i</div>

        </a>
    </section>
{% endblock content %}
